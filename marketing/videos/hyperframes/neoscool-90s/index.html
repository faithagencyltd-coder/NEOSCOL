<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1920, height=1080" />
    <title>NeoScool — Module scolaire (90 s)</title>
    <script src="assets/gsap.min.js"></script>
    <script src="assets/icons.js"></script>
    <style>
      @font-face { font-family: "Poppins"; font-weight: 500; src: url("assets/fonts/Poppins-500.ttf"); }
      @font-face { font-family: "Poppins"; font-weight: 600; src: url("assets/fonts/Poppins-600.ttf"); }
      @font-face { font-family: "Poppins"; font-weight: 700; src: url("assets/fonts/Poppins-700.ttf"); }
      @font-face { font-family: "Poppins"; font-weight: 800; src: url("assets/fonts/Poppins-800.ttf"); }
      :root {
        --night: #050d24; --navy: #0b1f4f; --navy2: #12358a; --blue: #1f6bff; --sky: #3aa0ff;
        --orange: #f7931e; --green: #1e9e6a; --red: #e4572e; --violet: #8b5cf6; --ink: #0b1f4f;
        --muted: rgba(255, 255, 255, 0.66);
      }
      * { box-sizing: border-box; }
      body { margin: 0; background: var(--night); color: #fff; font-family: "Poppins", sans-serif; }
      #root { position: relative; width: 100%; height: 100%; overflow: hidden; background: var(--night); }
      .clip { position: absolute; inset: 0; }
      .inner { position: absolute; inset: 0; }
      .abs { position: absolute; }

      /* ---------- Fond ---------- */
      #bg-fill { position: absolute; inset: 0; background: radial-gradient(1300px 900px at 68% 28%, #133a92 0%, #0b1f4f 46%, #050d24 100%); }
      .orb { position: absolute; width: 900px; height: 900px; border-radius: 50%; opacity: 0.55; }
      #orb1 { left: -250px; top: -300px; background: radial-gradient(circle, rgba(31, 107, 255, 0.55), transparent 65%); }
      #orb2 { left: 1250px; top: 380px; background: radial-gradient(circle, rgba(58, 160, 255, 0.4), transparent 65%); }
      #orb3 { left: 520px; top: 640px; background: radial-gradient(circle, rgba(139, 92, 246, 0.28), transparent 65%); }
      #grid { position: absolute; left: 0; right: 0; bottom: 0; height: 420px; opacity: 0.22; }
      .dust { position: absolute; width: 4px; height: 4px; border-radius: 50%; background: #9fd0ff; }
      #vignette { position: absolute; inset: 0; background: radial-gradient(1400px 900px at 50% 45%, transparent 55%, rgba(2, 6, 20, 0.75)); }

      /* ---------- Éléments communs ---------- */
      .glass {
        position: absolute; border-radius: 28px;
        background: linear-gradient(150deg, rgba(255, 255, 255, 0.16), rgba(255, 255, 255, 0.04));
        border: 1px solid rgba(255, 255, 255, 0.2);
        box-shadow: 0 40px 90px rgba(0, 0, 0, 0.38), inset 0 1px 0 rgba(255, 255, 255, 0.28);
      }
      .tile {
        display: flex; align-items: center; justify-content: center; border-radius: 22px; color: #fff; flex: none;
        box-shadow: 0 18px 40px rgba(0, 0, 0, 0.35), inset 0 2px 0 rgba(255, 255, 255, 0.35), inset 0 -6px 14px rgba(0, 0, 0, 0.18);
      }
      .t-blue { background: linear-gradient(145deg, #4c8dff, #1f4fd6); }
      .t-sky { background: linear-gradient(145deg, #5cc0ff, #1f7fe0); }
      .t-green { background: linear-gradient(145deg, #34c48a, #128257); }
      .t-orange { background: linear-gradient(145deg, #ffb04d, #e0750a); }
      .t-red { background: linear-gradient(145deg, #ff7a52, #c53d1c); }
      .t-violet { background: linear-gradient(145deg, #a989ff, #6d43e0); }
      .t-navy { background: linear-gradient(145deg, #2a4aa8, #0f2465); }
      .ico svg { display: block; }
      .phone {
        position: absolute; width: 300px; height: 620px; border-radius: 52px; padding: 12px;
        background: linear-gradient(160deg, #1d2c5e, #0a1330); box-shadow: 0 50px 100px rgba(0, 0, 0, 0.5), inset 0 1px 0 rgba(255, 255, 255, 0.2);
      }
      .phone .screen { position: absolute; inset: 12px; border-radius: 42px; overflow: hidden; background: linear-gradient(180deg, #f6f8fd, #e6ecf8); color: var(--ink); }
      .phone .notch { position: absolute; left: 50%; top: 20px; width: 96px; height: 26px; margin-left: -48px; border-radius: 14px; background: #0a1330; z-index: 5; }
      .app-bar { padding: 52px 22px 14px; background: linear-gradient(135deg, var(--blue), var(--sky)); color: #fff; }
      .app-bar b { display: block; font-size: 22px; font-weight: 700; }
      .app-bar span { font-size: 13px; opacity: 0.85; }
      .pill { display: inline-flex; align-items: center; gap: 8px; padding: 8px 16px; border-radius: 999px; font-weight: 600; font-size: 18px; white-space: nowrap; }
      .doc { position: absolute; background: #fff; border-radius: 16px; color: var(--ink); box-shadow: 0 40px 80px rgba(0, 0, 0, 0.4); overflow: hidden; }
      .line { height: 9px; border-radius: 5px; background: #dde5f2; }
      .muted { color: var(--muted); }

      /* ---------- Textes ---------- */
      .copy { position: absolute; left: 120px; top: 0; bottom: 0; width: 640px; display: flex; flex-direction: column; justify-content: center; }
      .eyebrow { display: flex; align-items: center; gap: 14px; font-size: 20px; font-weight: 600; letter-spacing: 3px; text-transform: uppercase; color: var(--sky); margin-bottom: 22px; }
      .eyebrow .num { display: inline-flex; width: 46px; height: 46px; border-radius: 14px; align-items: center; justify-content: center; background: rgba(58, 160, 255, 0.15); border: 1px solid rgba(58, 160, 255, 0.45); color: #fff; letter-spacing: 0; }
      .title { margin: 0; font-size: 64px; line-height: 1.08; font-weight: 800; letter-spacing: -1.5px; }
      .title .w { display: inline-block; margin-right: 16px; }
      .title .hl { color: var(--sky); }
      .title .ho { color: var(--orange); }
      .chips { display: flex; flex-wrap: wrap; gap: 12px; margin-top: 34px; }
      .chip { display: inline-flex; align-items: center; gap: 10px; padding: 10px 18px; border-radius: 999px; font-size: 19px; font-weight: 600; background: rgba(255, 255, 255, 0.08); border: 1px solid rgba(255, 255, 255, 0.18); }
      .chip .dot { width: 9px; height: 9px; border-radius: 50%; background: var(--sky); }
      .stage { position: absolute; left: 820px; top: 110px; width: 980px; height: 800px; perspective: 1400px; }
      .caption { position: absolute; left: 0; right: 0; bottom: 86px; text-align: center; }
      .caption .big { font-size: 60px; font-weight: 800; letter-spacing: -1.5px; }
      .caption .big .w { display: inline-block; margin: 0 9px; }

      /* ---------- Bandeau marque + progression ---------- */
      #brand-logo { position: absolute; left: 64px; top: 46px; display: flex; align-items: center; gap: 14px; font-size: 30px; font-weight: 800; letter-spacing: -0.5px; }
      #brand-logo img { width: 52px; height: 52px; }
      .o { color: var(--orange); } .s { color: var(--sky); }
      #progress { position: absolute; right: 70px; top: 64px; display: flex; gap: 10px; }
      .seg { width: 54px; height: 6px; border-radius: 3px; background: rgba(255, 255, 255, 0.16); overflow: hidden; }
      .seg i { display: block; width: 100%; height: 100%; background: linear-gradient(90deg, var(--sky), var(--blue)); transform-origin: left center; }
      .flash { position: absolute; inset: 0; background: radial-gradient(circle at 50% 46%, rgba(255, 255, 255, 0.95), rgba(58, 160, 255, 0.35) 30%, transparent 60%); opacity: 0; }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="main" data-start="0" data-width="1920" data-height="1080" data-duration="91">
      <!-- Fond persistant -->
      <div id="bg" class="clip" data-start="0" data-duration="91" data-track-index="0">
        <div id="bg-fill"></div>
        <div id="orb1" class="orb"></div>
        <div id="orb2" class="orb"></div>
        <div id="orb3" class="orb"></div>
        <svg id="grid" viewBox="0 0 1920 420" preserveAspectRatio="none"></svg>
        <div id="dusts"></div>
        <div id="vignette"></div>
      </div>

      <section id="s1" class="clip" data-start="0" data-duration="8.6" data-track-index="1"><div class="inner" id="s1i"></div></section>
      <section id="s2" class="clip" data-start="8.6" data-duration="6.4" data-track-index="1"><div class="inner" id="s2i"></div></section>
      <section id="s3" class="clip" data-start="15" data-duration="9.4" data-track-index="1"><div class="inner" id="s3i"></div></section>
      <section id="s4" class="clip" data-start="24.4" data-duration="8.6" data-track-index="1"><div class="inner" id="s4i"></div></section>
      <section id="s5" class="clip" data-start="33" data-duration="7.4" data-track-index="1"><div class="inner" id="s5i"></div></section>
      <section id="s6" class="clip" data-start="40.4" data-duration="7.4" data-track-index="1"><div class="inner" id="s6i"></div></section>
      <section id="s7" class="clip" data-start="47.8" data-duration="11" data-track-index="1"><div class="inner" id="s7i"></div></section>
      <section id="s8" class="clip" data-start="58.8" data-duration="7.4" data-track-index="1"><div class="inner" id="s8i"></div></section>
      <section id="s9" class="clip" data-start="66.2" data-duration="7.8" data-track-index="1"><div class="inner" id="s9i"></div></section>
      <section id="s10" class="clip" data-start="74" data-duration="8.4" data-track-index="1"><div class="inner" id="s10i"></div></section>
      <section id="s11" class="clip" data-start="82.4" data-duration="8.6" data-track-index="1"><div class="inner" id="s11i"></div></section>

      <!-- Marque et progression des chapitres (scènes 3 à 10) -->
      <div id="brand" class="clip" data-start="15" data-duration="67.4" data-track-index="2">
        <div id="brand-in" class="inner">
          <div id="brand-logo"><img src="assets/logo-mark.png" alt="" /><span><span class="o">.</span>Neo<span class="s">Scool</span></span></div>
          <div id="progress"></div>
        </div>
      </div>
      <div id="flashes" class="clip" data-start="0" data-duration="91" data-track-index="3"></div>

      <!-- Son : musique + voix off -->
      <audio id="music" src="assets/audio/musique.wav" data-start="0" data-duration="91" data-volume="0.42" data-track-index="10"></audio>
      <audio id="v1" src="assets/audio/chaos.wav" data-start="0.6" data-duration="7.04" data-track-index="11"></audio>
      <audio id="v2" src="assets/audio/unifie.wav" data-start="9.1" data-duration="4.42" data-track-index="11"></audio>
      <audio id="v3" src="assets/audio/inscription.wav" data-start="15.5" data-duration="7.21" data-track-index="11"></audio>
      <audio id="v4" src="assets/audio/arrivee.wav" data-start="24.9" data-duration="5.42" data-track-index="11"></audio>
      <audio id="v5" src="assets/audio/classe.wav" data-start="33.5" data-duration="4.14" data-track-index="11"></audio>
      <audio id="v6" src="assets/audio/bulletins.wav" data-start="40.9" data-duration="4.16" data-track-index="11"></audio>
      <audio id="v7" src="assets/audio/caisse.wav" data-start="48.3" data-duration="8.77" data-track-index="11"></audio>
      <audio id="v8" src="assets/audio/communication.wav" data-start="59.3" data-duration="4.57" data-track-index="11"></audio>
      <audio id="v9" src="assets/audio/documents.wav" data-start="66.7" data-duration="5.48" data-track-index="11"></audio>
      <audio id="v10" src="assets/audio/pilotage.wav" data-start="74.5" data-duration="5.29" data-track-index="11"></audio>
      <audio id="v11" src="assets/audio/signature.wav" data-start="83" data-duration="6.29" data-track-index="11"></audio>
    </div>

    <script>
      // ======================================================================
      // Outils (construction du DOM au chargement, sans aléa non initialisé)
      // ======================================================================
      const $ = (s) => document.querySelector(s);
      function rng(seed) {
        return () => {
          seed |= 0; seed = (seed + 0x6d2b79f5) | 0;
          let t = Math.imul(seed ^ (seed >>> 15), 1 | seed);
          t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
          return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
        };
      }
      const R = rng(20261007);
      const ic = (name, size = 24, color = "currentColor", sw = 2) =>
        `<span class="ico" style="display:inline-flex;color:${color}">${window.ICONS[name]
          .replace(/width="24"/, `width="${size}"`).replace(/height="24"/, `height="${size}"`).replace(/stroke-width="2"/, `stroke-width="${sw}"`)}</span>`;
      const tile = (name, cls, size = 96, isz = 46, extra = "") =>
        `<div class="tile ${cls}" style="width:${size}px;height:${size}px;border-radius:${size * 0.26}px;${extra}">${ic(name, isz, "#fff", 2.2)}</div>`;
      function qr(seed, size, color = "#0b1f4f") {
        const r = rng(seed), n = 25, c = size / n;
        let s = `<svg width="${size}" height="${size}" viewBox="0 0 ${size} ${size}"><rect width="${size}" height="${size}" fill="#fff"/>`;
        const finder = (x, y) =>
          `<rect x="${x * c}" y="${y * c}" width="${7 * c}" height="${7 * c}" fill="${color}"/><rect x="${(x + 1) * c}" y="${(y + 1) * c}" width="${5 * c}" height="${5 * c}" fill="#fff"/><rect x="${(x + 2) * c}" y="${(y + 2) * c}" width="${3 * c}" height="${3 * c}" fill="${color}"/>`;
        for (let y = 0; y < n; y++) for (let x = 0; x < n; x++) {
          const inF = (x < 8 && y < 8) || (x > 16 && y < 8) || (x < 8 && y > 16);
          if (!inF && r() > 0.52) s += `<rect x="${x * c}" y="${y * c}" width="${c + 0.4}" height="${c + 0.4}" fill="${color}"/>`;
        }
        return s + finder(0, 0) + finder(18, 0) + finder(0, 18) + "</svg>";
      }
      const words = (txt) =>
        txt.split(" ").map((w) => {
          const m = w.match(/^\[(h|o)\](.*)$/);
          return m ? `<span class="w ${m[1] === "h" ? "hl" : "ho"}">${m[2]}</span>` : `<span class="w">${w}</span>`;
        }).join("");
      const copy = (num, label, title, chips) => `
        <div class="copy">
          <div class="eyebrow"><span class="num">${num}</span><span class="lbl">${label}</span></div>
          <h2 class="title">${words(title)}</h2>
          <div class="chips">${chips.map((c) => `<span class="chip"><span class="dot"></span>${c}</span>`).join("")}</div>
        </div>`;

      // ======================================================================
      // Fond
      // ======================================================================
      (() => {
        let g = "";
        for (let i = 0; i <= 24; i++) { const x = (i / 24) * 1920; g += `<line x1="${960 + (x - 960) * 0.25}" y1="0" x2="${x}" y2="420" stroke="#3aa0ff" stroke-width="1"/>`; }
        for (let j = 1; j <= 8; j++) { const y = Math.pow(j / 8, 1.8) * 420; g += `<line x1="0" y1="${y}" x2="1920" y2="${y}" stroke="#3aa0ff" stroke-width="1"/>`; }
        $("#grid").innerHTML = g;
        let d = "";
        for (let i = 0; i < 60; i++) d += `<div class="dust" style="left:${R() * 1920}px;top:${R() * 1080}px;opacity:${0.15 + R() * 0.45};transform:scale(${0.5 + R()})"></div>`;
        $("#dusts").innerHTML = d;
        let p = "";
        for (let i = 0; i < 8; i++) p += `<div class="seg"><i id="seg${i}"></i></div>`;
        $("#progress").innerHTML = p;
        let f = "";
        for (let i = 0; i < 12; i++) f += `<div class="flash" id="fl${i}"></div>`;
        $("#flashes").innerHTML = f;
      })();

      // ======================================================================
      // Scène 1 — le chaos
      // ======================================================================
      const S1_ITEMS = [];
      (() => {
        const kinds = ["paper", "notebook", "receipt", "sticky", "paper", "phone", "notebook", "clock", "receipt", "paper", "sticky", "notebook", "paper", "receipt", "paper", "notebook"];
        let h = `<div id="vortex" class="abs" style="left:960px;top:440px;width:0;height:0">`;
        kinds.forEach((k, i) => {
          const a = (i / kinds.length) * Math.PI * 2 + R() * 0.4;
          const rx = 300 + R() * 360, ry = 150 + R() * 170;
          S1_ITEMS.push({ x: Math.cos(a) * rx, y: Math.sin(a) * ry, a, rx, ry, r: (R() - 0.5) * 50, k });
          let inner = "";
          if (k === "paper") inner = `<div style="width:130px;height:168px;background:#fff;border-radius:12px;padding:20px 16px;box-shadow:0 20px 40px rgba(0,0,0,.35)"><div class="line" style="width:60%;background:#1f6bff;margin-bottom:12px"></div><div class="line" style="margin-bottom:9px"></div><div class="line" style="margin-bottom:9px"></div><div class="line" style="width:80%;margin-bottom:9px"></div><div class="line" style="width:50%"></div></div>`;
          if (k === "notebook") { const col = ["#e4572e", "#1e9e6a", "#8b5cf6", "#f7931e"][i % 4]; inner = `<div style="width:136px;height:176px;background:${col};border-radius:12px;box-shadow:0 20px 40px rgba(0,0,0,.35);position:relative"><div style="position:absolute;left:0;top:0;bottom:0;width:16px;background:rgba(0,0,0,.2);border-radius:12px 0 0 12px"></div><div style="position:absolute;left:34px;right:18px;top:34px;height:30px;background:rgba(255,255,255,.85);border-radius:6px"></div></div>`; }
          if (k === "receipt") inner = `<div style="width:116px;height:180px;background:#fff8e6;clip-path:polygon(0 0,100% 0,100% 92%,90% 100%,80% 92%,70% 100%,60% 92%,50% 100%,40% 92%,30% 100%,20% 92%,10% 100%,0 92%);padding:18px 14px"><div class="line" style="width:70%;background:#c9a24a;margin-bottom:12px"></div><div class="line" style="margin-bottom:8px"></div><div class="line" style="margin-bottom:8px"></div><div class="line" style="width:40%;background:#e4572e"></div></div>`;
          if (k === "sticky") inner = `<div style="width:110px;height:110px;background:#ffd166;border-radius:6px;box-shadow:0 16px 30px rgba(0,0,0,.3);padding:18px"><div class="line" style="background:rgba(0,0,0,.18);margin-bottom:9px"></div><div class="line" style="background:rgba(0,0,0,.18);width:70%"></div></div>`;
          if (k === "phone") inner = `<div style="width:96px;height:180px;background:#0f1d47;border-radius:20px;border:6px solid #1d2c5e;position:relative;box-shadow:0 20px 40px rgba(0,0,0,.4)"><div style="position:absolute;right:-16px;top:-16px;width:40px;height:40px;border-radius:50%;background:#e4572e;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:18px">12</div><div style="position:absolute;left:14px;right:14px;top:40px;height:22px;border-radius:6px;background:rgba(255,255,255,.85)"></div><div style="position:absolute;left:14px;right:14px;top:72px;height:22px;border-radius:6px;background:rgba(255,255,255,.6)"></div></div>`;
          if (k === "clock") inner = `<div style="width:130px;height:130px;border-radius:50%;background:#fff;border:8px solid #22346e;position:relative;box-shadow:0 20px 40px rgba(0,0,0,.35)"><div id="s1hand" style="position:absolute;left:53px;top:12px;width:8px;height:52px;background:#e4572e;border-radius:4px;transform-origin:4px 52px"></div><div style="position:absolute;left:49px;top:49px;width:16px;height:16px;border-radius:50%;background:#22346e"></div></div>`;
          h += `<div class="abs s1item" id="s1it${i}" style="left:-68px;top:-88px">${inner}</div>`;
        });
        h += `</div>`;
        const alerts = [["Reçu introuvable", 300, 250], ["Absence non signalée", 1330, 210], ["Impayé ?", 380, 640], ["Bulletin en retard", 1300, 640]];
        alerts.forEach(([t, x, y], i) => {
          h += `<div class="abs s1alert" id="s1al${i}" style="left:${x}px;top:${y}px"><div class="pill" style="background:rgba(228,87,46,.16);border:2px solid #e4572e;color:#fff;font-size:22px;padding:12px 22px;box-shadow:0 14px 40px rgba(228,87,46,.35)">${ic("TriangleAlert", 24, "#ff8a65")} ${t}</div></div>`;
        });
        h += `<div class="caption" id="s1cap"><div class="big">${words("Registres, reçus, cahiers…")}</div><div class="big" style="font-size:46px;margin-top:6px">${words("[o]et [o]des [o]parents [o]sans [o]nouvelles.")}</div></div>`;
        $("#s1i").innerHTML = h;
      })();

      // ======================================================================
      // Scène 2 — tout s'unifie
      // ======================================================================
      (() => {
        let h = `<div id="s2center" class="abs" style="left:960px;top:400px;width:0;height:0">`;
        for (let i = 0; i < 70; i++) h += `<div class="abs s2p" id="s2p${i}" style="left:-5px;top:-5px;width:10px;height:10px;border-radius:50%;background:${i % 5 === 0 ? "#f7931e" : "#7cc4ff"};box-shadow:0 0 12px #3aa0ff"></div>`;
        h += `<div id="s2ring" class="abs" style="left:-170px;top:-170px;width:340px;height:340px;border-radius:50%;border:3px solid rgba(124,196,255,.8)"></div>`;
        h += `<div id="s2logo" class="abs" style="left:-130px;top:-200px;width:260px;height:300px;display:flex;flex-direction:column;align-items:center">
                <img src="assets/logo-mark.png" style="width:200px;height:200px;filter:drop-shadow(0 20px 50px rgba(31,107,255,.7))" />
                <div id="s2word" style="font-size:64px;font-weight:800;letter-spacing:-1.5px;white-space:nowrap"><span class="o">.</span>Neo<span class="s">Scool</span></div>
              </div>`;
        h += `</div>`;
        const levels = [["Baby", "t-orange", "Maternelle", "PS → GS"], ["Backpack", "t-green", "Primaire", "CI → CM2"], ["BookOpen", "t-sky", "Collège", "6e → 3e"], ["GraduationCap", "t-violet", "Lycée", "2nde → Tle"]];
        h += `<div id="s2line" class="abs" style="left:420px;top:676px;width:1080px;height:4px;border-radius:2px;background:linear-gradient(90deg,#f7931e,#1e9e6a,#3aa0ff,#8b5cf6);transform-origin:left center"></div>`;
        levels.forEach(([icon, cls, name, sub], i) => {
          h += `<div class="glass s2card" id="s2c${i}" style="left:${330 + i * 330}px;top:600px;width:300px;height:150px;display:flex;align-items:center;gap:18px;padding:0 24px">
