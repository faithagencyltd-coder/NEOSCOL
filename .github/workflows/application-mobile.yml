# Application mobile NeoScool : construction automatique Android (APK + AAB) et vérification iPhone.
# - APK de test (debug) : toujours, téléchargeable dans « Artifacts » de l'exécution.
# - APK / AAB signés (Play Store) : seulement si les secrets de signature existent.
# - iPhone : compilation pour le simulateur (la publication App Store demande un compte Apple Developer).
# Variable facultative du dépôt : NEOSCOOL_SERVER_URL (adresse proposée par défaut dans l'application).
name: Application mobile

on:
  workflow_dispatch:
  push:
    paths:
      - "mobile/**"
      - ".github/workflows/application-mobile.yml"

permissions:
  contents: read

jobs:
  android:
    name: Android (APK)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile
    env:
      NEOSCOOL_SERVER_URL: ${{ vars.NEOSCOOL_SERVER_URL }}
      NEOSCOOL_APP_VERSION: 1.0.${{ github.run_number }}
      NEOSCOOL_VERSION_CODE: ${{ github.run_number }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: mobile/package-lock.json
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - name: Dépendances
        run: npm ci
      - name: Tests de la logique de l'application
        run: npm test
      - name: Configuration et synchronisation Capacitor
        run: node scripts/config.mjs && npx cap sync android
      - name: APK de test (debug)
        working-directory: mobile/android
        run: ./gradlew --no-daemon assembleDebug
      - name: Clé de signature (si les secrets existent)
        id: keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        if: env.KEYSTORE_BASE64 != ''
        run: |
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/neoscool.jks"
          echo "path=$RUNNER_TEMP/neoscool.jks" >> "$GITHUB_OUTPUT"
      - name: APK et AAB signés (Play Store)
        if: steps.keystore.outputs.path != ''
        working-directory: mobile/android
        env:
          NEOSCOOL_KEYSTORE: ${{ steps.keystore.outputs.path }}
          NEOSCOOL_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          NEOSCOOL_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          NEOSCOOL_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: ./gradlew --no-daemon assembleRelease bundleRelease
      - name: Fichiers à télécharger
        run: |
          mkdir -p ../livraison
          cp android/app/build/outputs/apk/debug/app-debug.apk "../livraison/NeoScool-${NEOSCOOL_APP_VERSION}-test.apk"
          if [ -f android/app/build/outputs/apk/release/app-release.apk ]; then
            cp android/app/build/outputs/apk/release/app-release.apk "../livraison/NeoScool-${NEOSCOOL_APP_VERSION}.apk"
            cp android/app/build/outputs/bundle/release/app-release.aab "../livraison/NeoScool-${NEOSCOOL_APP_VERSION}.aab"
          fi
          ls -la ../livraison
      - uses: actions/upload-artifact@v4
        with:
          name: NeoScool-Android-${{ env.NEOSCOOL_APP_VERSION }}
          path: livraison/
          retention-days: 30

  ios:
    name: iPhone (simulateur)
    runs-on: macos-latest
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: mobile/package-lock.json
      - name: Dépendances
        run: npm ci
      - name: Configuration et synchronisation Capacitor
        env:
          NEOSCOOL_SERVER_URL: ${{ vars.NEOSCOOL_SERVER_URL }}
        run: node scripts/config.mjs && npx cap sync ios
      - name: Compilation pour le simulateur (sans signature)
        run: xcodebuild -project ios/App/App.xcodeproj -scheme App -configuration Debug -sdk iphonesimulator -destination "generic/platform=iOS Simulator" CODE_SIGNING_ALLOWED=NO build | tail -n 40
